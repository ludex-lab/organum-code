name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  source-consumer-current:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - run: bun test tests/source-install.test.ts
      - run: bun run smoke:source-install

  release-foundation:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run test:release
      - run: bun run smoke:source-install
      - run: bun run build:bundle-local
      - run: bun run smoke:release-archive
